<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facts'2.0 | Official Creator Hub (@factss-2.0)</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts: Orbitron, Rajdhani, & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FF0000;
            --primary-hover: #d60000;
            --primary-glow: rgba(255, 0, 0, 0.45);
            --primary-dim: rgba(255, 0, 0, 0.12);
            --bg-black: #08090b;
            --bg-darker: #0d0f14;
            --bg-card: rgba(18, 21, 28, 0.75);
            --bg-card-hover: rgba(26, 30, 40, 0.95);
            --glass-bg: rgba(10, 12, 16, 0.88);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-white: #ffffff;
            --text-sub: #9ca3af;
            --text-muted: #64748b;
            --font-display: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            --font-body: 'Inter', sans-serif;
            --transition-smooth: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 0, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(255, 0, 0, 0.06) 0%, transparent 50%),
                linear-gradient(to bottom, rgba(8, 9, 11, 0.98), rgba(8, 9, 11, 1));
            background-attachment: fixed;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #08090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b0b0e;
            border-radius: 4px;
            border: 1px solid var(--primary-glow);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Fixed Glassmorphism Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--glass-border);
            transition: var(--transition-smooth);
        }

        .navbar.scrolled {
            border-bottom-color: rgba(255, 0, 0, 0.4);
            box-shadow: 0 4px 30px rgba(255, 0, 0, 0.15);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: var(--text-white);
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--primary), #8b0000);
            color: #fff;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.95rem;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-sub);
            font-family: var(--font-sub);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: var(--transition-smooth);
            position: relative;
            padding: 0.3rem 0;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: #ffffff;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--text-white);
            padding: 0.5rem 1.4rem;
            border-radius: 8px;
            font-family: var(--font-sub);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-decoration: none;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
            transition: var(--transition-smooth);
        }

        .nav-cta:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 22px var(--primary-glow);
            transform: translateY(-2px);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            color: var(--text-white);
            font-size: 1.6rem;
            cursor: pointer;
            outline: none;
        }

        /* 90vh Hero Section */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 7.5rem 2rem 3.5rem;
            overflow: hidden;
        }

        .hero-bg-grid {
            position: absolute;
            inset: 0;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            z-index: 1;
        }

        .hero-glow-sphere {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,0,0,0.25) 0%, rgba(255,0,0,0.01) 70%, transparent 100%);
            filter: blur(65px);
            z-index: 1;
            pointer-events: none;
            animation: pulseGlow 6s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) translate(-10px, 10px); opacity: 0.6; }
            100% { transform: scale(1.15) translate(15px, -15px); opacity: 0.95; }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 920px;
            text-align: center;
            margin: 0 auto;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 0, 0, 0.12);
            border: 1px solid rgba(255, 0, 0, 0.35);
            padding: 0.45rem 1.2rem;
            border-radius: 50px;
            font-size: 0.88rem;
            font-family: var(--font-sub);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 700;
            color: #ff4d4d;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
        }

        .pulsing-dot {
            width: 9px;
            height: 9px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: radarPulse 1.6s infinite ease-out;
        }

        @keyframes radarPulse {
            0% { transform: scale(0.8); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(0.8); opacity: 1; }
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.3rem, 6vw, 4.4rem);
            font-weight: 900;
            line-height: 1.12;
            letter-spacing: -0.01em;
            margin-bottom: 1.3rem;
            text-transform: uppercase;
        }

        .hero-title span {
            background: linear-gradient(135deg, #ffffff 40%, #ff4d4d 85%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.25);
        }

        .hero-subtitle {
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            color: var(--text-sub);
            max-width: 720px;
            margin: 0 auto 2.5rem;
            font-weight: 400;
        }

        .hero-subtitle strong {
            color: #ffffff;
            font-weight: 600;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            padding: 0.9rem 2.2rem;
            border-radius: 10px;
            font-family: var(--font-sub);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 0 25px var(--primary-glow);
            border: 1px solid #ff3333;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.75);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-white);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
        }

        /* Sections Common */
        .section {
            padding: 6rem 2rem;
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .section-tag {
            font-family: var(--font-sub);
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .section-desc {
            color: var(--text-sub);
            max-width: 620px;
            margin: 0.8rem auto 0;
            font-size: 1rem;
        }

        /* Video Showcase Cards */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: var(--transition-smooth);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 0, 0, 0.5);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
            background: var(--bg-card-hover);
        }

        .video-thumbnail-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #11141c;
            overflow: hidden;
            cursor: pointer;
        }

        .video-thumbnail-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover .video-thumbnail-box img {
            transform: scale(1.06);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .play-btn-circle {
            width: 56px;
            height: 56px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: var(--transition-smooth);
        }

        .video-card:hover .play-btn-circle {
            transform: scale(1.15);
            background: #ff2a2a;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.9);
        }

        .video-info {
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .video-meta-date {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            font-family: var(--font-sub);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .video-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-white);
            margin-bottom: 1.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .watch-link {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .watch-link:hover {
            color: var(--primary);
            gap: 0.7rem;
        }

        /* About & Channel Stats */
        .about-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 3.5rem;
            align-items: center;
        }

        .about-text-panel {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.8rem;
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .about-text-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        .about-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin-bottom: 1.2rem;
        }

        .about-bio {
            color: var(--text-sub);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        .channel-niche-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .niche-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            padding: 0.35rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: var(--font-sub);
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .niche-tag i {
            color: var(--primary);
            margin-right: 0.3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 0, 0, 0.4);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.15);
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.8rem;
            display: inline-block;
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.2rem;
        }

        .stat-label {
            color: var(--text-sub);
            font-family: var(--font-sub);
            font-size: 1.05rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Contact Section */
        .contact-container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .form-label {
            font-size: 0.95rem;
